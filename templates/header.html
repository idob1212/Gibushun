<!DOCTYPE html>
<html dir="rtl" lang="he">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="">
  <meta name="theme-color" content="#1f2937">
  <title>מימדיון</title>

  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo-meymadion.png') }}">

  <!-- Icons (kept from the previous design) -->
  <link href="{{ url_for('static', filename='vendor/fontawesome-free/css/all.min.css') }}" rel="stylesheet" type="text/css">
  <!-- Modern Hebrew font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- App styles (Tailwind v4 + DaisyUI, built from static/src/input.css) -->
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>

<body class="bg-base-200 text-base-content min-h-screen">

{% set is_admin = current_user.is_authenticated and current_user.id == 0 %}

<div class="drawer">
  <input id="nav-drawer" type="checkbox" class="drawer-toggle" />

  <div class="drawer-content flex flex-col min-h-screen">

    <!-- Top bar -->
    <div class="navbar bg-base-100 shadow-sm sticky top-0 z-30 px-1 min-h-14">
      {% if current_user.is_authenticated %}
      <div class="flex-none">
        <label for="nav-drawer" class="btn btn-square btn-ghost" aria-label="תפריט">
          <i class="fas fa-bars text-lg"></i>
        </label>
      </div>
      {% endif %}
      <div class="flex-1 justify-center">
        <a href="{{ url_for('home') }}" class="btn btn-ghost px-2">
          <img src="{{ url_for('static', filename='img/logo-meymadion.png') }}" class="h-8 w-auto" alt="מימדיון" />
        </a>
      </div>
      <div class="flex-none">
        {% if current_user.is_authenticated %}
          <a href="{{ url_for('logout') }}" class="btn btn-ghost btn-sm" aria-label="התנתק" title="התנתק">
            <i class="fas fa-sign-out-alt text-lg"></i>
          </a>
        {% else %}
          <a href="{{ url_for('login') }}" class="btn btn-primary btn-sm">התחבר</a>
        {% endif %}
      </div>
    </div>

    <!-- Page content (closed in footer.html) -->
    <main class="flex-1 w-full max-w-3xl mx-auto px-3 py-4 pb-28 md:pb-6">
