{% import "_formhelpers.html" as f %}

{% block content %}
{% include "header.html" %}

<section class="app-hero px-5 pt-6 pb-6" style="background-image:url('{{ url_for('static', filename='img/ODT.jpg') }}')">
  <h1 class="text-2xl font-extrabold leading-tight">הזן נתוני סיכום</h1>
</section>

<div class="px-4 mt-4">
  {% include "flash-messages.html" %}
</div>

<section class="px-4 mt-4 max-w-md mx-auto">
  <div class="card bg-base-100 shadow-sm">
    <div class="card-body p-4">
      {{ f.render_form(form, submit_label="שמור") }}
    </div>
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Get the candidate select element
    var candidateSelect = document.getElementById('id');

    // Add change event listener
    candidateSelect.addEventListener('change', function() {
        // Redirect to same page with candidate_id parameter
        window.location.href = "{{ url_for('AddStatus') }}?candidate_id=" + this.value;
    });
});
</script>

{% include "footer.html" %}
{% endblock %}
