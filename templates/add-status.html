{% import "_formhelpers.html" as f %}

{% block content %}
{% include "header.html" %}

<section class="app-hero px-5 pt-6 pb-6" style="background-image:url('{{ url_for('static', filename='img/ODT.jpg') }}')">
  <h1 class="text-2xl font-extrabold leading-tight">הזן נתוני סיכום</h1>
</section>

<div class="px-4 mt-4">
  {% include "flash-messages.html" %}
</div>

<section class="px-4 mt-4 max-w-md mx-auto">
  <div class="card bg-base-100 shadow-sm">
    <div class="card-body p-4">
      {{ f.render_form(form, submit_label="שמור", offline=True) }}
    </div>
  </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function () {
  // Saved status + summary per candidate: switching candidates fills them in
  // without a reload. A summary typed and not saved is not thrown away
  // silently (field audit) — the switch asks first.
  var current = {{ current | tojson }};
  var candidate = document.getElementById('id');
  var status = document.getElementById('final_status');
  var note = document.getElementById('final_note');
  if (!candidate || !status || !note) return;
  var shown = candidate.value;
  function loaded() { return current[shown] || ['', '']; }
  function dirty() { return status.value !== loaded()[0] || note.value !== loaded()[1]; }
  candidate.addEventListener('change', function () {
    if (dirty() && !window.confirm('הסיכום של מגובש ' + shown + ' לא נשמר. לעבור בכל זאת?')) {
      candidate.value = shown;
      return;
    }
    shown = candidate.value;
    status.value = loaded()[0];
    note.value = loaded()[1];
    [status, note].forEach(function (el) { el.dispatchEvent(new Event('change', { bubbles: true })); });
    try { history.replaceState(null, '', '?candidate_id=' + encodeURIComponent(shown)); } catch (e) {}
  });
});
</script>

{% include "footer.html" %}
{% endblock %}
